<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Productivity Hub — Kelola tugas, sesi fokus, dan jurnal harianmu dalam satu aplikasi." />
  <title>Productivity Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-400: #2dd4bf;
      --teal-300: #5eead4;
      --teal-50:  #f0fdfa;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --white: #ffffff;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.08);
      --nav-height: 68px;
      --header-height: 64px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--slate-100);
      min-height:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;
    }
    #app{
      position:relative;width:100%;max-width:420px;
      min-height:100vh;background:var(--slate-100);
      display:flex;flex-direction:column;overflow:hidden;
    }
    @media(min-width:480px){
      body{align-items:center;min-height:100vh;padding:24px 0}
      #app{
        min-height:min(900px,calc(100vh - 48px));
        max-height:min(900px,calc(100vh - 48px));
        border-radius:40px;
        box-shadow:var(--shadow-lg),0 0 0 8px rgba(15,118,110,.08);
        overflow:hidden;
      }
    }
    /* HEADER */
    .app-header{
      position:sticky;top:0;z-index:100;height:var(--header-height);
      background:linear-gradient(135deg,var(--teal-700) 0%,var(--teal-600) 100%);
      display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;
    }
    .app-header-icon{width:36px;height:36px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .app-header-text{flex:1}
    .app-header-text h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
    .app-header-text p{font-size:11px;color:rgba(255,255,255,.72);margin-top:1px}
    .header-date{font-size:11px;font-weight:500;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
    /* CONTENT */
    .tab-content-wrapper{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-height) + 8px);scroll-behavior:smooth}
    .tab-panel{display:none;animation:fadeSlideIn .25s ease both}
    .tab-panel.active{display:block}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    /* BOTTOM NAV */
    .bottom-nav{
      position:sticky;bottom:0;z-index:200;height:var(--nav-height);
      background:#fff;border-top:1px solid var(--slate-200);
      display:flex;align-items:stretch;flex-shrink:0;
      box-shadow:0 -4px 20px rgba(0,0,0,.07);
    }
    .nav-tab{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;border:none;background:transparent;cursor:pointer;padding:8px 4px;
      transition:all .2s ease;position:relative;-webkit-tap-highlight-color:transparent;
    }
    .nav-tab::before{
      content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
      width:36px;height:3px;background:var(--teal-500);border-radius:0 0 4px 4px;
      transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .nav-tab.active::before{transform:translateX(-50%) scaleX(1)}
    .nav-tab-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
    .nav-tab.active .nav-tab-icon{transform:scale(1.15)}
    .nav-tab svg{width:22px;height:22px;stroke-width:1.8;stroke:var(--slate-400);fill:none;transition:stroke .2s}
    .nav-tab.active svg{stroke:var(--teal-600)}
    .nav-label{font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--slate-400);transition:color .2s}
    .nav-tab.active .nav-label{color:var(--teal-600)}
    /* SECTIONS */
    .section-header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between}
    .section-title{font-size:20px;font-weight:800;color:var(--slate-900)}
    .section-subtitle{font-size:13px;color:var(--slate-500);margin-top:2px}
    /* CARDS */
    .card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
    .card-padded{padding:16px}
    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:inherit;font-weight:600;transition:all .18s ease;-webkit-tap-highlight-color:transparent}
    .btn:active{transform:scale(.96)}
    .btn-primary{background:linear-gradient(135deg,var(--teal-700),var(--teal-500));color:#fff;border-radius:var(--radius-sm);padding:12px 20px;font-size:14px;box-shadow:0 4px 14px rgba(15,118,110,.35)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(15,118,110,.45)}
    /* INPUTS */
    .input-row{display:flex;gap:8px;align-items:flex-start}
    .input-field{flex:1;padding:12px 14px;font-size:14px;font-family:inherit;font-weight:500;border:2px solid var(--slate-200);border-radius:var(--radius-sm);outline:none;transition:border-color .2s,box-shadow .2s;background:#fff;color:var(--slate-900)}
    .input-field::placeholder{color:var(--slate-400);font-weight:400}
    .input-field:focus{border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
    textarea.input-field{resize:none;line-height:1.6}
    /* TASKS */
    .task-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 16px}
    .task-stat{background:#fff;border-radius:var(--radius-md);padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
    .task-stat-number{font-size:22px;font-weight:800;color:var(--teal-700)}
    .task-stat-label{font-size:10px;font-weight:500;color:var(--slate-500);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
    .add-task-form{padding:0 20px 16px}
    .add-task-inputs{display:flex;flex-direction:column;gap:8px}
    .priority-row{display:flex;gap:6px}
    .priority-chip{flex:1;padding:7px 4px;text-align:center;font-size:11px;font-weight:700;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.4px}
    .priority-chip[data-p="low"]{background:#ecfdf5;color:#059669;border-color:#d1fae5}
    .priority-chip[data-p="medium"]{background:#fffbeb;color:#d97706;border-color:#fef3c7}
    .priority-chip[data-p="high"]{background:#fef2f2;color:#dc2626;border-color:#fee2e2}
    .priority-chip.selected[data-p="low"]{border-color:#059669;box-shadow:0 0 0 2px rgba(5,150,105,.2)}
    .priority-chip.selected[data-p="medium"]{border-color:#d97706;box-shadow:0 0 0 2px rgba(217,119,6,.2)}
    .priority-chip.selected[data-p="high"]{border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.2)}
    .filter-row{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto}
    .filter-row::-webkit-scrollbar{display:none}
    .filter-chip{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:600;border-radius:20px;border:2px solid var(--slate-200);background:#fff;color:var(--slate-500);cursor:pointer;transition:all .15s}
    .filter-chip.active{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}
    .task-list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
    .task-item{background:#fff;border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:all .2s ease;animation:fadeSlideIn .2s ease both}
    .task-item.done{opacity:.55}
    .task-check{width:22px;height:22px;border-radius:6px;flex-shrink:0;border:2px solid var(--slate-300);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);background:#fff}
    .task-check.checked{background:var(--teal-600);border-color:var(--teal-600)}
    .task-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0;transition:opacity .15s;fill:none}
    .task-check.checked svg{opacity:1}
    .task-info{flex:1;min-width:0}
    .task-text{font-size:14px;font-weight:500;color:var(--slate-800);line-height:1.4}
    .task-item.done .task-text{text-decoration:line-through;color:var(--slate-400)}
    .task-badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
    .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
    .badge-low{background:#ecfdf5;color:#059669}
    .badge-medium{background:#fffbeb;color:#d97706}
    .badge-high{background:#fef2f2;color:#dc2626}
    .badge-date{background:var(--slate-100);color:var(--slate-500)}
    .task-delete{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--slate-300);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
    .task-delete:hover{background:#fef2f2;color:var(--danger)}
    .task-delete svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
    .empty-state{text-align:center;padding:48px 20px}
    .empty-state .empty-icon{font-size:48px;margin-bottom:12px}
    .empty-state p{font-size:14px;color:var(--slate-400);font-weight:500}
    /* FOCUS */
    .focus-panel{padding:20px}
    .preset-row{display:flex;gap:8px;margin-bottom:24px}
    .preset-btn{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;border-radius:var(--radius-sm);border:2px solid var(--slate-200);background:#fff;color:var(--slate-600);cursor:pointer;transition:all .18s}
    .preset-btn.active{background:var(--teal-700);color:#fff;border-color:var(--teal-700);box-shadow:0 4px 12px rgba(15,118,110,.3)}
    .timer-ring-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:28px}
    .timer-ring-container{position:relative;width:230px;height:230px}
    .timer-svg{width:100%;height:100%;transform:rotate(-90deg)}
    .timer-track{fill:none;stroke:var(--slate-200);stroke-width:10}
    .timer-progress{fill:none;stroke:url(#timerGradient);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
    .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .timer-display{font-size:52px;font-weight:800;color:var(--slate-900);letter-spacing:-3px;line-height:1}
    .timer-label{font-size:12px;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:1px;margin-top:6px}
    .timer-controls{display:flex;justify-content:center;gap:14px;margin-bottom:28px}
    .timer-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
    .timer-btn:active{transform:scale(.9)}
    .timer-btn-main{width:68px;height:68px;background:linear-gradient(135deg,var(--teal-700),var(--teal-500));box-shadow:0 6px 20px rgba(15,118,110,.4)}
    .timer-btn-main svg{width:28px;height:28px;fill:white;stroke:none}
    .timer-btn-secondary{background:#fff;box-shadow:var(--shadow-md)}
    .timer-btn-secondary svg{width:20px;height:20px;stroke:var(--slate-500);fill:none;stroke-width:2}
    .session-card{background:#fff;border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm)}
    .session-card h3{font-size:13px;font-weight:700;color:var(--slate-700);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
    .session-dots{display:flex;gap:8px;flex-wrap:wrap}
    .session-dot{width:20px;height:20px;border-radius:50%;background:var(--slate-200);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
    .session-dot.done{background:linear-gradient(135deg,var(--teal-600),var(--teal-400));box-shadow:0 2px 8px rgba(20,184,166,.4);transform:scale(1.1)}
    .focus-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .focus-stat{background:var(--teal-50);border-radius:var(--radius-sm);padding:12px}
    .focus-stat-num{font-size:20px;font-weight:800;color:var(--teal-700)}
    .focus-stat-label{font-size:11px;color:var(--teal-600);margin-top:2px;font-weight:500}
    /* JOURNAL */
    .journal-panel{padding:0 20px 20px}
    .mood-selector{background:#fff;border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
    .mood-selector h3{font-size:12px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .mood-row{display:flex;gap:8px}
    .mood-btn{flex:1;padding:10px 4px;border-radius:var(--radius-sm);border:2px solid var(--slate-200);background:#fff;cursor:pointer;font-size:20px;text-align:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;gap:3px}
    .mood-btn span.mood-label{font-size:9px;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:.3px}
    .mood-btn.selected{border-color:var(--teal-500);background:var(--teal-50);transform:scale(1.05)}
    .mood-btn.selected span.mood-label{color:var(--teal-700)}
    .journal-compose{background:#fff;border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px}
    .journal-compose h3{font-size:13px;font-weight:700;color:var(--slate-700);margin-bottom:10px}
    textarea.journal-input{width:100%;min-height:100px;padding:12px;border:2px solid var(--slate-200);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--slate-800);outline:none;transition:border-color .2s,box-shadow .2s;resize:none;line-height:1.7}
    textarea.journal-input:focus{border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
    .journal-char-count{font-size:11px;color:var(--slate-400);text-align:right;margin-top:6px}
    .journal-save-row{display:flex;justify-content:flex-end;margin-top:10px}
    .journal-entries{display:flex;flex-direction:column;gap:10px}
    .journal-day-label{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
    .journal-entry-card{background:#fff;border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);animation:fadeSlideIn .2s ease both;border-left:3px solid var(--teal-400);margin-bottom:8px}
    .journal-entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .journal-entry-meta{display:flex;align-items:center;gap:8px}
    .journal-entry-mood{font-size:18px}
    .journal-entry-time{font-size:11px;font-weight:600;color:var(--slate-400)}
    .journal-entry-text{font-size:14px;color:var(--slate-700);line-height:1.65}
    .journal-entry-delete{width:26px;height:26px;border-radius:6px;border:none;background:none;color:var(--slate-300);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
    .journal-entry-delete:hover{background:#fef2f2;color:var(--danger)}
    .journal-entry-delete svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
    .tab-content-wrapper::-webkit-scrollbar{width:3px}
    .tab-content-wrapper::-webkit-scrollbar-track{background:transparent}
    .tab-content-wrapper::-webkit-scrollbar-thumb{background:var(--teal-300);border-radius:4px}
    #toast-container{position:fixed;bottom:calc(var(--nav-height) + 16px);left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{background:var(--slate-800);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;white-space:nowrap;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1) both;box-shadow:var(--shadow-md)}
    .toast.out{animation:toastOut .3s ease both}
    @keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-8px) scale(.9)}}
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header-icon">🚀</div>
      <div class="app-header-text">
        <h1>Productivity Hub</h1>
        <p id="header-subtitle">Ayo capai targetmu hari ini!</p>
      </div>
      <div class="header-date" id="header-date"></div>
    </header>

    <div class="tab-content-wrapper" id="tab-content-wrapper">

      <!-- TAB 1: TUGAS -->
      <div class="tab-panel active" id="panel-tasks">
        <div class="section-header">
          <div>
            <div class="section-title">📋 Tugas</div>
            <div class="section-subtitle">Kelola daftar tugasmu</div>
          </div>
        </div>
        <div class="task-summary">
          <div class="task-stat"><div class="task-stat-number" id="stat-total">0</div><div class="task-stat-label">Total</div></div>
          <div class="task-stat"><div class="task-stat-number" id="stat-done">0</div><div class="task-stat-label">Selesai</div></div>
          <div class="task-stat"><div class="task-stat-number" id="stat-pending">0</div><div class="task-stat-label">Tertunda</div></div>
        </div>
        <div class="add-task-form">
          <div class="card card-padded add-task-inputs">
            <div class="input-row">
              <input type="text" id="task-input" class="input-field" placeholder="Tambah tugas baru…" maxlength="120" autocomplete="off" />
              <button class="btn btn-primary" id="add-task-btn" style="width:46px;height:46px;border-radius:var(--radius-sm);flex-shrink:0;padding:0;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <div class="priority-row" id="priority-selector">
              <button class="priority-chip selected" data-p="low">🟢 Rendah</button>
              <button class="priority-chip" data-p="medium">🟡 Sedang</button>
              <button class="priority-chip" data-p="high">🔴 Tinggi</button>
            </div>
          </div>
        </div>
        <div class="filter-row" id="filter-row">
          <button class="filter-chip active" data-f="all">Semua</button>
          <button class="filter-chip" data-f="pending">Tertunda</button>
          <button class="filter-chip" data-f="done">Selesai</button>
          <button class="filter-chip" data-f="high">🔴 Tinggi</button>
          <button class="filter-chip" data-f="medium">🟡 Sedang</button>
          <button class="filter-chip" data-f="low">🟢 Rendah</button>
        </div>
        <div class="task-list" id="task-list"></div>
      </div>

      <!-- TAB 2: FOKUS -->
      <div class="tab-panel" id="panel-focus">
        <div class="section-header">
          <div>
            <div class="section-title">⏱️ Fokus</div>
            <div class="section-subtitle">Sesi Pomodoro kamu</div>
          </div>
        </div>
        <div class="focus-panel">
          <div class="preset-row" id="preset-row">
            <button class="preset-btn active" data-min="25">🍅 25m</button>
            <button class="preset-btn" data-min="15">⚡ 15m</button>
            <button class="preset-btn" data-min="5">☕ 5m</button>
            <button class="preset-btn" data-min="50">🧠 50m</button>
          </div>
          <div class="timer-ring-wrap">
            <div class="timer-ring-container">
              <svg class="timer-svg" viewBox="0 0 200 200">
                <defs>
                  <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0f766e"/>
                    <stop offset="100%" style="stop-color:#2dd4bf"/>
                  </linearGradient>
                </defs>
                <circle class="timer-track" cx="100" cy="100" r="88"/>
                <circle class="timer-progress" id="timer-progress" cx="100" cy="100" r="88"/>
              </svg>
              <div class="timer-center">
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-label" id="timer-mode-label">FOKUS</div>
              </div>
            </div>
          </div>
          <div class="timer-controls">
            <button class="timer-btn timer-btn-secondary" id="timer-reset-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.33"/></svg>
            </button>
            <button class="timer-btn timer-btn-main" id="timer-start-btn">
              <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="white"/></svg>
              <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16" fill="white"/><rect x="14" y="4" width="4" height="16" fill="white"/></svg>
            </button>
            <button class="timer-btn timer-btn-secondary" id="timer-skip-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>
          <div class="session-card">
            <h3>Sesi Hari Ini</h3>
            <div class="session-dots" id="session-dots"></div>
            <div class="focus-stats">
              <div class="focus-stat"><div class="focus-stat-num" id="stat-sessions">0</div><div class="focus-stat-label">Sesi Selesai</div></div>
              <div class="focus-stat"><div class="focus-stat-num" id="stat-focus-time">0m</div><div class="focus-stat-label">Waktu Fokus</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 3: JURNAL -->
      <div class="tab-panel" id="panel-journal">
        <div class="section-header">
          <div>
            <div class="section-title">📓 Jurnal</div>
            <div class="section-subtitle">Catatan perasaan harianmu</div>
          </div>
        </div>
        <div class="journal-panel">
          <div class="mood-selector">
            <h3>Perasaan Kamu Hari Ini?</h3>
            <div class="mood-row" id="mood-row">
              <button class="mood-btn" data-mood="😄">😄<span class="mood-label">Bahagia</span></button>
              <button class="mood-btn" data-mood="😊">😊<span class="mood-label">Oke</span></button>
              <button class="mood-btn" data-mood="😐">😐<span class="mood-label">Biasa</span></button>
              <button class="mood-btn" data-mood="😔">😔<span class="mood-label">Sedih</span></button>
              <button class="mood-btn" data-mood="😤">😤<span class="mood-label">Marah</span></button>
            </div>
          </div>
          <div class="journal-compose">
            <h3>Tulis Catatanmu</h3>
            <textarea id="journal-input" class="journal-input" placeholder="Apa yang kamu rasakan atau pikirkan hari ini?…" maxlength="500"></textarea>
            <div class="journal-char-count"><span id="journal-char">0</span>/500</div>
            <div class="journal-save-row">
              <button class="btn btn-primary" id="save-journal-btn" style="padding:10px 22px;font-size:13px;">💾 Simpan Catatan</button>
            </div>
          </div>
          <div class="journal-entries" id="journal-entries"></div>
        </div>
      </div>

    </div><!-- end tab-content-wrapper -->

    <nav class="bottom-nav" role="navigation" aria-label="Navigasi Utama">
      <button class="nav-tab active" id="nav-tasks" data-tab="tasks" aria-label="Tab Tugas">
        <div class="nav-tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span class="nav-label">Tugas</span>
      </button>
      <button class="nav-tab" id="nav-focus" data-tab="focus" aria-label="Tab Fokus">
        <div class="nav-tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <span class="nav-label">Fokus</span>
      </button>
      <button class="nav-tab" id="nav-journal" data-tab="journal" aria-label="Tab Jurnal">
        <div class="nav-tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/>
          </svg>
        </div>
        <span class="nav-label">Jurnal</span>
      </button>
    </nav>
  </div>
  <div id="toast-container"></div>

  <script>
  (function(){
    'use strict';
    var $ = function(s,c){return (c||document).querySelector(s);};
    var $$ = function(s,c){return Array.from((c||document).querySelectorAll(s));};
    function save(k,v){try{localStorage.setItem('ph_'+k,JSON.stringify(v));}catch(e){}}
    function load(k,d){try{var v=localStorage.getItem('ph_'+k);return v!==null?JSON.parse(v):d;}catch(e){return d;}}
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
    function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function toast(msg,dur){
      dur=dur||2200;
      var el=document.createElement('div');
      el.className='toast';el.textContent=msg;
      $('#toast-container').appendChild(el);
      setTimeout(function(){el.classList.add('out');el.addEventListener('animationend',function(){el.remove();});},dur);
    }
    function fmt(secs){return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
    function shortDate(ts){return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
    function timeStr(ts){return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
    function todayKey(){return new Date().toISOString().slice(0,10);}

    // HEADER GREETING
    (function(){
      var h=new Date().getHours();
      var g=h<5?'Tengah malam! 🌃':h<12?'Selamat pagi! ☀️':h<17?'Selamat siang! 🌤️':h<21?'Selamat sore! 🌇':'Selamat malam! 🌙';
      $('#header-subtitle').textContent=g;
      $('#header-date').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'});
    })();

    // TABS
    var navTabs=$$('.nav-tab');
    var panels={tasks:$('#panel-tasks'),focus:$('#panel-focus'),journal:$('#panel-journal')};
    function switchTab(name){
      navTabs.forEach(function(t){t.classList.toggle('active',t.dataset.tab===name);});
      Object.keys(panels).forEach(function(n){panels[n].classList.toggle('active',n===name);});
      $('#tab-content-wrapper').scrollTop=0;
    }
    navTabs.forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});

    // === TASKS ===
    var tasks=load('tasks',[]);
    var selPriority='low';
    var activeFilter='all';

    $$('.priority-chip').forEach(function(c){
      c.addEventListener('click',function(){
        $$('.priority-chip').forEach(function(x){x.classList.remove('selected');});
        c.classList.add('selected');selPriority=c.dataset.p;
      });
    });
    $$('.filter-chip').forEach(function(c){
      c.addEventListener('click',function(){
        $$('.filter-chip').forEach(function(x){x.classList.remove('active');});
        c.classList.add('active');activeFilter=c.dataset.f;renderTasks();
      });
    });

    function getFiltered(){
      if(activeFilter==='all')return tasks;
      if(activeFilter==='pending')return tasks.filter(function(t){return !t.done;});
      if(activeFilter==='done')return tasks.filter(function(t){return t.done;});
      return tasks.filter(function(t){return t.priority===activeFilter;});
    }

    function renderTasks(){
      var list=getFiltered();var el=$('#task-list');el.innerHTML='';
      $('#stat-total').textContent=tasks.length;
      $('#stat-done').textContent=tasks.filter(function(t){return t.done;}).length;
      $('#stat-pending').textContent=tasks.filter(function(t){return !t.done;}).length;
      if(!list.length){
        var msg=activeFilter==='done'?'Belum ada tugas selesai.':activeFilter==='pending'?'Semua tugas selesai! 🎉':'Tambahkan tugas pertamamu!';
        el.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div><p>'+msg+'</p></div>';
        return;
      }
      list.forEach(function(t){
        var d=document.createElement('div');
        d.className='task-item'+(t.done?' done':'');
        var pb=t.priority==='low'?'🟢 Rendah':t.priority==='medium'?'🟡 Sedang':'🔴 Tinggi';
        d.innerHTML='<div class="task-check '+(t.done?'checked':'')+'" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>'
          +'<div class="task-info"><div class="task-text">'+escHtml(t.text)+'</div>'
          +'<div class="task-badges"><span class="badge badge-'+t.priority+'">'+pb+'</span><span class="badge badge-date">'+shortDate(t.createdAt)+'</span></div></div>'
          +'<button class="task-delete" data-id="'+t.id+'"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
        d.querySelector('.task-check').addEventListener('click',function(){toggleTask(t.id);});
        d.querySelector('.task-delete').addEventListener('click',function(){deleteTask(t.id);});
        el.appendChild(d);
      });
    }

    function addTask(){
      var inp=$('#task-input');var text=inp.value.trim();
      if(!text){toast('⚠️ Masukkan teks tugas!');return;}
      tasks.unshift({id:uid(),text:text,priority:selPriority,done:false,createdAt:Date.now()});
      save('tasks',tasks);inp.value='';renderTasks();toast('✅ Tugas ditambahkan!');
    }
    function toggleTask(id){
      var t=tasks.find(function(x){return x.id===id;});if(!t)return;
      t.done=!t.done;save('tasks',tasks);renderTasks();
      if(t.done)toast('🎉 Tugas selesai! Kerja bagus!');
    }
    function deleteTask(id){tasks=tasks.filter(function(x){return x.id!==id;});save('tasks',tasks);renderTasks();toast('🗑️ Tugas dihapus.');}

    $('#add-task-btn').addEventListener('click',addTask);
    $('#task-input').addEventListener('keydown',function(e){if(e.key==='Enter')addTask();});
    renderTasks();

    // === FOCUS TIMER ===
    var CIRC=2*Math.PI*88;
    var timerDur=25*60,timerRem=25*60,timerRun=false,timerInt=null,isBreak=false;
    var focusData=load('focus_today',{date:todayKey(),sessions:0,minutes:0});
    if(focusData.date!==todayKey()){focusData={date:todayKey(),sessions:0,minutes:0};save('focus_today',focusData);}

    var progressEl=$('#timer-progress');
    progressEl.style.strokeDasharray=CIRC;
    progressEl.style.strokeDashoffset=0;

    function updateTimerUI(){
      $('#timer-display').textContent=fmt(timerRem);
      progressEl.style.strokeDashoffset=CIRC*(1-timerRem/timerDur);
      document.title=timerRun?'('+fmt(timerRem)+') Productivity Hub':'Productivity Hub';
    }

    function updateSessionUI(){
      var dots=$('#session-dots');dots.innerHTML='';
      var total=Math.max(4,focusData.sessions+1);
      for(var i=0;i<total;i++){
        var d=document.createElement('div');
        d.className='session-dot'+(i<focusData.sessions?' done':'');
        dots.appendChild(d);
      }
      $('#stat-sessions').textContent=focusData.sessions;
      $('#stat-focus-time').textContent=focusData.minutes+'m';
    }
    updateSessionUI();

    $$('.preset-btn').forEach(function(b){
      b.addEventListener('click',function(){
        if(timerRun)return;
        $$('.preset-btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');
        timerDur=parseInt(b.dataset.min)*60;timerRem=timerDur;
        isBreak=false;$('#timer-mode-label').textContent='FOKUS';updateTimerUI();
      });
    });

    function startTimer(){
      timerRun=true;$('#play-icon').style.display='none';$('#pause-icon').style.display='block';
      timerInt=setInterval(function(){
        if(timerRem<=0){clearInterval(timerInt);timerRun=false;sessionDone();return;}
        timerRem--;updateTimerUI();
      },1000);
    }
    function pauseTimer(){
      timerRun=false;clearInterval(timerInt);
      $('#play-icon').style.display='block';$('#pause-icon').style.display='none';
    }
    function resetTimer(){pauseTimer();timerRem=timerDur;updateTimerUI();}

    function sessionDone(){
      $('#play-icon').style.display='block';$('#pause-icon').style.display='none';
      if(!isBreak){
        var mins=Math.round(timerDur/60);
        focusData.sessions++;focusData.minutes+=mins;save('focus_today',focusData);updateSessionUI();
        toast('🍅 Sesi '+mins+'m selesai! Istirahat sejenak.');
        isBreak=true;timerDur=5*60;timerRem=timerDur;$('#timer-mode-label').textContent='ISTIRAHAT';
        $$('.preset-btn').forEach(function(x){x.classList.remove('active');});
      }else{
        toast('☕ Istirahat selesai! Siap fokus lagi?');
        isBreak=false;timerDur=25*60;timerRem=timerDur;$('#timer-mode-label').textContent='FOKUS';
        $$('.preset-btn').forEach(function(x){x.classList.remove('active');});
        var def=document.querySelector('[data-min="25"]');if(def)def.classList.add('active');
      }
      updateTimerUI();
      if('vibrate' in navigator)navigator.vibrate([200,100,200]);
    }

    $('#timer-start-btn').addEventListener('click',function(){timerRun?pauseTimer():startTimer();});
    $('#timer-reset-btn').addEventListener('click',resetTimer);
    $('#timer-skip-btn').addEventListener('click',function(){pauseTimer();timerRem=0;sessionDone();});
    updateTimerUI();

    // === JOURNAL ===
    var journals=load('journals',[]);
    var selMood='😊';

    $$('.mood-btn').forEach(function(b){
      b.addEventListener('click',function(){
        $$('.mood-btn').forEach(function(x){x.classList.remove('selected');});
        b.classList.add('selected');selMood=b.dataset.mood;
      });
    });

    var jInp=$('#journal-input');
    jInp.addEventListener('input',function(){$('#journal-char').textContent=jInp.value.length;});

    function saveJournal(){
      var text=jInp.value.trim();if(!text){toast('⚠️ Tulis catatan terlebih dahulu!');return;}
      journals.unshift({id:uid(),text:text,mood:selMood,createdAt:Date.now()});
      save('journals',journals);jInp.value='';$('#journal-char').textContent='0';
      renderJournal();toast('📓 Catatan tersimpan!');
    }
    function deleteJournal(id){journals=journals.filter(function(x){return x.id!==id;});save('journals',journals);renderJournal();toast('🗑️ Catatan dihapus.');}

    function renderJournal(){
      var cont=$('#journal-entries');
      if(!journals.length){cont.innerHTML='<div class="empty-state"><div class="empty-icon">📖</div><p>Belum ada catatan. Mulai tulis sekarang!</p></div>';return;}
      var groups={};
      journals.forEach(function(j){var k=shortDate(j.createdAt);if(!groups[k])groups[k]=[];groups[k].push(j);});
      cont.innerHTML='';
      Object.keys(groups).forEach(function(date){
        var entries=groups[date];
        var grp=document.createElement('div');grp.className='journal-day-group';
        grp.innerHTML='<div class="journal-day-label">'+date+'</div>';
        entries.forEach(function(j){
          var card=document.createElement('div');card.className='journal-entry-card';
          card.innerHTML='<div class="journal-entry-header"><div class="journal-entry-meta"><span class="journal-entry-mood">'+j.mood+'</span><span class="journal-entry-time">'+timeStr(j.createdAt)+'</span></div>'
            +'<button class="journal-entry-delete" data-id="'+j.id+'"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>'
            +'<div class="journal-entry-text">'+escHtml(j.text).replace(/\n/g,'<br>')+'</div>';
          card.querySelector('.journal-entry-delete').addEventListener('click',function(){deleteJournal(j.id);});
          grp.appendChild(card);
        });
        cont.appendChild(grp);
      });
    }

    $('#save-journal-btn').addEventListener('click',saveJournal);
    renderJournal();
  })();
  </script>
</body>
</html>
